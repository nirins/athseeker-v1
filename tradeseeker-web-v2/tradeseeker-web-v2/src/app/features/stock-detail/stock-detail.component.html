<div class="stock-detail-container">
  <button class="back-pill" *ngIf="isNative" (click)="goBack()">‹</button>
  <div class="header">
    <div class="title-group">
      <h1 class="stock-title">{{ symbol }}</h1>
      <button
        class="watchlist-star-btn"
        [class.watched]="isWatched"
        (click)="toggleWatchlist()"
        [title]="isWatched ? 'Remove from watchlist' : 'Add to watchlist'"
        [attr.aria-label]="isWatched ? 'Remove ' + symbol + ' from watchlist' : 'Add ' + symbol + ' to watchlist'">
        {{ isWatched ? '★' : '☆' }}
      </button>
    </div>
    <div class="controls">
      <button 
        class="openai-button"
        (click)="refreshData()"
        [disabled]="isRefreshing"
        [title]="'Fetch latest data from EODHD for ' + symbol">
        {{ isRefreshing ? 'Refreshing...' : 'Refresh' }}
      </button>
      <button 
        class="openai-button"
        (click)="getOpenAIAnalysis()"
        [disabled]="isLoadingOpenAI">
        {{ isLoadingOpenAI ? 'Loading...' : 'OpenAI' }}
      </button>
    </div>
  </div>

  <!-- Refresh toast notifications -->
  <div class="refresh-toast refresh-toast--success" *ngIf="refreshMessage">✓ {{ refreshMessage }}</div>
  <div class="refresh-toast refresh-toast--error" *ngIf="refreshError">✗ {{ refreshError }}</div>

  <div class="loading-container" *ngIf="isLoading">
    <app-loading-spinner></app-loading-spinner>
    <p>Loading {{ symbol }} data for all time periods...</p>
  </div>

  <div class="error-container" *ngIf="error && !isLoading">
    <app-error-message [message]="error"></app-error-message>
  </div>

  <!-- OpenAI Analysis Section -->
  <div class="openai-analysis" *ngIf="openAIAnalysis">
    <div class="analysis-header">
      <h2>AI Analysis for {{ symbol }}</h2>
      <div class="sentiment-badge" [ngClass]="getSentimentClass()">
        {{ getSentimentFromAnalysis() }}
      </div>
    </div>
    <div class="analysis-content">
      <div class="analysis-points" [innerHTML]="getFormattedAnalysis()"></div>
    </div>
  </div>

  <!-- OpenAI Loading State -->
  <div class="openai-loading" *ngIf="isLoadingOpenAI">
    <app-loading-spinner></app-loading-spinner>
    <p>Getting AI analysis for {{ symbol }}...</p>
  </div>

  <!-- OpenAI Error State -->
  <div class="openai-error" *ngIf="openAIError">
    <app-error-message [message]="openAIError"></app-error-message>
  </div>

  <div class="charts-grid" *ngIf="!isLoading && !error && stockDataArray.length > 0">
    <div class="chart-item" *ngFor="let stockData of stockDataArray; let i = index">
      <div class="chart-header">
        <h3>{{ getTimeRangeLabel(i) }}</h3>
        <span class="data-points">{{ stockData.prices.length }} data points</span>
      </div>
      <div class="chart-wrapper">
        <app-stock-chart 
          [stockData]="stockData"
          [displayMode]="selectedDisplayMode"
          [chartType]="selectedChartType"
          [isDetailView]="true">
        </app-stock-chart>
      </div>
    </div>
  </div>

  <button class="scroll-top-pill" *ngIf="showScrollTop" (click)="scrollToTop()">↑</button>
</div>
