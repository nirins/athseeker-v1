<div class="display-mode-selector">
  <label class="selector-label" for="display-mode-select">Display:</label>
  <select
    id="display-mode-select"
    class="display-dropdown"
    [value]="selectedMode"
    (change)="onModeSelect($any($event.target).value)"
  >
    <option *ngFor="let mode of displayModes" [value]="mode.value">
      {{ mode.label }}
    </option>
  </select>
</div>
