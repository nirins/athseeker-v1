<div class="stock-chart-container" [class.detail-view]="isDetailView">
  <div *ngIf="isLoading" class="loading-state">
    <app-loading-spinner></app-loading-spinner>
  </div>

  <div *ngIf="error" class="error-state">
    <app-error-message [message]="error"></app-error-message>
  </div>

  <div *ngIf="!isLoading && !error" class="chart-wrapper">
    <div class="main-chart">
      <!-- Overlay Header on top of chart -->
      <div class="chart-overlay-header" *ngIf="!isDetailView">
        <div class="header-content">
          <h3 class="chart-title" 
              (click)="navigateToDetail()" 
              (auxclick)="$event.button === 1 && navigateToDetail()"
              title="Click to open {{ currentStockData.symbol }} details in new tab">
            {{ currentStockData.symbol }}
          </h3>
          <span class="beauty-score" *ngIf="beautyScore !== null">{{ displayScore }}</span>
          <button 
            class="score-btn" 
            *ngIf="isLabelMode"
            (click)="showGradeSelectionPopup()" 
            title="Score this chart for training data">
            <span class="score-icon">🏷️</span>
          </button>
        </div>
      </div>
      
      <canvas 
        #chartCanvas
        [class.clickable-chart]="!isDetailView"
        (click)="onCanvasClick($event)"
        (auxclick)="onCanvasAuxClick($event)"
        title="Click to open {{ currentStockData.symbol }} details in new tab">
      </canvas>
    </div>
    <div *ngIf="isDetailView" class="volume-chart">
      <canvas #volumeCanvas></canvas>
    </div>
  </div>
</div>
