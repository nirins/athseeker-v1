<div class="chart-grid">
  <app-stock-chart
    *ngFor="let stock of stockData"
    [stockData]="stock"
    [displayMode]="displayMode"
    [chartType]="chartType"
    [isLabelMode]="isLabelMode"
    [beautyScore]="beautyScoreMap.get(stock.symbol) ?? null"
    (gradeSelectionRequested)="onGradeSelectionRequested($event)">
  </app-stock-chart>
</div>
