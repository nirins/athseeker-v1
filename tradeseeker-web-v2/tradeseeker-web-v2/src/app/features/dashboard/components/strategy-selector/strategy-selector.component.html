<div class="strategy-selector">
  <label class="selector-label" for="strategy-select">Strategy:</label>
  <select
    id="strategy-select"
    class="strategy-dropdown"
    [value]="selectedStrategy"
    (change)="onStrategySelect($any($event.target).value)"
  >
    <option *ngFor="let strategy of strategies" [value]="strategy.value">
      {{ strategy.label }}
    </option>
  </select>
</div>
