<div class="strategy-selector">
  <label class="selector-label">Strategy</label>
  <div class="button-group">
    <button
      *ngFor="let strategy of strategies"
      class="strategy-button"
      [class.active]="selectedStrategy === strategy.value"
      (click)="onStrategySelect(strategy.value)"
    >
      {{ strategy.label }}
    </button>
  </div>
</div>
